[project]
name = "nrc2fit"
version = "0.1.0"
description = "Convert a Nike Run Club data export into FIT files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["fit-tool>=0.9.13", "timezonefinder>=6.5"]

[project.scripts]
nrc2fit = "nrc2fit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["nrc2fit.py"]
